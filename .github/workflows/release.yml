name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: zip -r "ngs-merge-image-${RELEASE_TAG}.zip" ngs_merge_img.bat samples README.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ngs-merge-image-${{ github.ref_name }}.zip